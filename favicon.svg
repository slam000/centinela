<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="scope" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2a2a"/>
      <stop offset="100%" stop-color="#050809"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f46"/>
      <stop offset="100%" stop-color="#15181b"/>
    </linearGradient>
    <linearGradient id="sweep" x1="256" y1="256" x2="256" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7fd8d0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7fd8d0" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f4"/>
      <stop offset="100%" stop-color="#9fb3b6"/>
    </linearGradient>
  </defs>

  <!-- Marco -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bezel)"/>
  <rect x="28" y="28" width="456" height="456" rx="86" fill="#0b0d10"/>

  <!-- Radar -->
  <circle cx="256" cy="256" r="200" fill="url(#scope)" stroke="#7fd8d0" stroke-width="6"/>
  <g fill="none" stroke="#7fd8d0" stroke-opacity="0.45" stroke-width="3">
    <circle cx="256" cy="256" r="134"/>
    <circle cx="256" cy="256" r="68"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="256" y1="56" x2="256" y2="456"/>
  </g>

  <!-- Barrido (abanico hacia arriba-derecha) -->
  <path d="M256 256 L256 56 A200 200 0 0 1 397.4 114.6 Z" fill="url(#sweep)" transform="rotate(20 256 256)"/>
  <line x1="256" y1="256" x2="397.4" y2="114.6" stroke="#bff3ee" stroke-width="5" stroke-linecap="round" transform="rotate(20 256 256)"/>

  <!-- Contactos de intel -->
  <circle cx="352" cy="132" r="13" fill="#ff4a3d"/>
  <circle cx="352" cy="132" r="24" fill="none" stroke="#ff4a3d" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="150" cy="346" r="9" fill="#7fd8d0"/>
  <circle cx="378" cy="330" r="8" fill="#f2b33d"/>

  <!-- Nave (vista superior) -->
  <g transform="translate(256 262)">
    <!-- Módulos laterales -->
    <path d="M-30 -20 L-52 -6 L-56 52 L-40 64 L-30 40 Z" fill="url(#hull)" stroke="#0b0d10" stroke-width="5" stroke-linejoin="round"/>
    <path d="M30 -20 L52 -6 L56 52 L40 64 L30 40 Z" fill="url(#hull)" stroke="#0b0d10" stroke-width="5" stroke-linejoin="round"/>
    <!-- Casco con proa en horquilla -->
    <path d="M-10 -104 L-4 -62 L4 -62 L10 -104 L22 -60 L30 -10 L26 56 L14 74 L-14 74 L-26 56 L-30 -10 L-22 -60 Z"
          fill="url(#hull)" stroke="#0b0d10" stroke-width="5" stroke-linejoin="round"/>
    <!-- Detalles -->
    <path d="M0 -44 L9 -14 L0 -2 L-9 -14 Z" fill="#7fd8d0"/>
    <line x1="-14" y1="12" x2="14" y2="12" stroke="#5d7275" stroke-width="4"/>
    <line x1="-16" y1="30" x2="16" y2="30" stroke="#5d7275" stroke-width="4"/>
    <!-- Motores -->
    <rect x="-13" y="72" width="10" height="16" rx="3" fill="#7fd8d0"/>
    <rect x="3" y="72" width="10" height="16" rx="3" fill="#7fd8d0"/>
    <rect x="-52" y="56" width="10" height="13" rx="3" fill="#7fd8d0"/>
    <rect x="42" y="56" width="10" height="13" rx="3" fill="#7fd8d0"/>
  </g>
</svg>
